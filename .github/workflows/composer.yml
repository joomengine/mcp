name: Composer bridge
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl
          tools: composer
          coverage: none
      - run: npm ci
      - run: npm run build
      - name: Exercise the PHP client over stdio and TLS
        run: |
          client_directory="$RUNNER_TEMP/joomengine-php-client"
          mkdir -p "$client_directory"
          if ! composer require --no-interaction --no-progress --working-dir="$client_directory" 'joomengine/mcp-client:^1.0' > "$RUNNER_TEMP/composer-client.log" 2>&1; then
            cat "$RUNNER_TEMP/composer-client.log"
            # Until mcp_client#5 ships, Packagist's only stable release requires an SDK blocked by Composer.
            grep -Fq 'PKSA-s52d-n7sx-trsg' "$RUNNER_TEMP/composer-client.log" || exit 1
            ref=adc0d788cbef14e6880c8befdfdb504c4de00c10
            checkout="$RUNNER_TEMP/joomengine-mcp-client-candidate"
            git init -q "$checkout"
            git -C "$checkout" fetch -q --depth=1 https://github.com/joomengine/mcp_client.git "$ref"
            git -C "$checkout" checkout -q --detach FETCH_HEAD
            echo 'Testing the SDK compatibility fix from joomengine/mcp_client#5.' >> "$GITHUB_STEP_SUMMARY"
            cd "$client_directory"
            composer init --name=joomengine/stdio-consumer --no-interaction
            composer config repositories.client path "$checkout"
            COMPOSER_ROOT_VERSION=dev-main composer require --no-interaction --no-progress 'joomengine/mcp-client:@dev'
            cd "$GITHUB_WORKSPACE"
          fi
          node test/joomla-composer.mjs "$client_directory/vendor/bin/joomengine-mcp"
